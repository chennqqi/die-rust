[workspace]
resolver = "2"
members = [
    "crates/die-core",
    "crates/die-formats",
    "crates/die-rules",
    "crates/die-engine",
    "crates/die-nfd",
    "crates/die-output",
    "crates/die-cli",
    "crates/die-ffi",
    "crates/die-server",
    "crates/die-gui",
    "xtask",
]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/chennqqi/die-rust"

# Internal crate versions are centralized so members reference them by
# `{ workspace = true }`. The dependency DAG is enforced by
# `xtask check-deps` and CI; see docs/design/architecture.md section 6.
[workspace.dependencies]
die-core = { path = "crates/die-core" }
die-formats = { path = "crates/die-formats" }
die-rules = { path = "crates/die-rules" }
die-engine = { path = "crates/die-engine" }
die-nfd = { path = "crates/die-nfd" }
die-output = { path = "crates/die-output" }
criterion = "0.5"
pelite = "0.10"
goblin = { version = "0.9", default-features = false, features = ["std", "elf32", "elf64", "mach32", "mach64", "endian_fd", "alloc"] }
