[package]
name = "die-gui"
description = "Detect It Easy — Tauri v2 GUI (ADR 0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "die"
path = "src/main.rs"

[dependencies]
diec-engine = { workspace = true }
diec-core = { workspace = true }
diec-output = { workspace = true }
diec-formats = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# 7B advanced features
cpp_demangle = "0.4"
rustc-demangle = "0.1"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "gas", "nasm", "instr_info"] }
# 7C extended features
yara-x = "1.19"
# File info: hashes, entropy, PE/ELF/Mach-O parsing
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
goblin = { version = "0.9" }
pelite = { workspace = true }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
yaxpeax-arm = "0.4.0"
yaxpeax-arch = "0.3.2"
crc32fast = "1.5.0"
# VirusTotal API integration (upstream XOnlineTools)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
open = "5"
msvc-demangler = "0.11"
md4 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1.8"
adler2 = "2.0"
crc = "3.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
diec-engine = { workspace = true }
diec-core = { workspace = true }
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# Tauri application metadata
# ---------------------------------------------------------------------------
# The frontend is built separately via `npm run build` in `frontend/`.
# Tauri embeds the `frontend/dist/` directory into the binary.
# Build: cd crates/die-gui/frontend && npm install && npm run build
#        cargo tauri build  (or)  cargo build -p die-gui
