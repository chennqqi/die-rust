[package]
name = "diec-engine"
description = "Scan orchestration, candidate selection, bounded nested queue and result aggregation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
diec-core = { workspace = true }
diec-formats = { workspace = true }
diec-rules = { workspace = true }
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
# Archive extraction libraries (ADR 0029/0030).
zip = { version = ">=2.6,<10", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
rars = "0.6"

[dev-dependencies]
criterion = { workspace = true }

[lib]
path = "src/lib.rs"

[[bench]]
name = "scan"
harness = false
