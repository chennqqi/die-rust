[package]
name = "die-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# This crate is NOT part of the workspace. It uses cargo-fuzz which requires
# nightly Rust and libFuzzer. Run with:
#   cd fuzz && cargo +nightly fuzz <target>
#
# The fuzz targets exercise the same code paths as the property-based tests
# in the workspace crates, but with libFuzzer's coverage-guided mutation.
#
# Seed-corpus replay (no nightly/libFuzzer required):
#   cd fuzz && cargo test --no-default-features --features replay

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fuzz_byte_source"
path = "fuzz_targets/fuzz_byte_source.rs"
required-features = ["libfuzzer"]

[[bin]]
name = "fuzz_format_probe"
path = "fuzz_targets/fuzz_format_probe.rs"
required-features = ["libfuzzer"]

[[bin]]
name = "fuzz_byte_view_subview"
path = "fuzz_targets/fuzz_byte_view_subview.rs"
required-features = ["libfuzzer"]

[[bin]]
name = "fuzz_scan_engine"
path = "fuzz_targets/fuzz_scan_engine.rs"
required-features = ["libfuzzer"]

[[bin]]
name = "fuzz_output_render"
path = "fuzz_targets/fuzz_output_render.rs"
required-features = ["libfuzzer"]

[[bin]]
name = "fuzz_scan_ffi"
path = "fuzz_targets/fuzz_scan_ffi.rs"
required-features = ["libfuzzer"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
die-core = { path = "../crates/die-core" }
die-formats = { path = "../crates/die-formats" }
die-engine = { path = "../crates/die-engine" }
die-output = { path = "../crates/die-output" }
die-ffi = { path = "../crates/die-ffi" }
serde_json = "1.0"

[features]
default = ["libfuzzer"]
libfuzzer = ["dep:libfuzzer-sys"]

# Seed-corpus replay mode: build fuzz harness bodies as a normal test
# target on stable Rust (no libFuzzer/nightly required). Used by CI and
# the release sign-off to verify all seed corpora are crash-free.
replay = []

# Independent workspace (not part of the main die-rust workspace).
# cargo-fuzz requires this to avoid dependency resolution conflicts.
[workspace]
members = ["."]
