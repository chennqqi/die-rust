name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Default toolchain (1.97.1): formatting, clippy, tests, build and the
  # workspace dependency DAG guard. Runs on all three desktop platforms.
  default:
    name: default (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Linux system dependencies (Tauri/GTK)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libglib2.0-dev \
            build-essential pkg-config libssl-dev

      - name: Copy data directories for die-gui build
        shell: bash
        run: |
          for dir in db db_extra db_custom dbs_min dbs_special peid_rules yara_rules; do
            mkdir -p "crates/die-gui/$dir"
            if [ -d "upstream/Detect-It-Easy/$dir" ]; then
              cp -r "upstream/Detect-It-Easy/$dir/"* "crates/die-gui/$dir/" 2>/dev/null || true
            fi
          done

      - name: Verify rust-toolchain.toml resolves to 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          # rustup honors rust-toolchain.toml; assert the active compiler is the
          # pinned default per ADR 0011.
          actual="$(rustc --version)"
          echo "$actual"
          case "$actual" in
            *"1.97.1"*) echo "default toolchain OK" ;;
            *) echo "expected rustc 1.97.1, got: $actual" >&2; exit 1 ;;
          esac

      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --workspace --all-features --locked

      - name: cargo build (release)
        shell: bash
        run: cargo build --workspace --all-targets --release --locked

      - name: xtask check-deps
        shell: bash
        run: cargo run -p xtask --locked -- check-deps

  # MSRV (1.88): build and test only, per ADR 0011. Clippy/fmt use the
  # default toolchain. Runs on all three desktop platforms.
  msrv:
    name: msrv 1.88 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Linux system dependencies (Tauri/GTK)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libglib2.0-dev \
            build-essential pkg-config libssl-dev

      - name: Copy data directories for die-gui build
        shell: bash
        run: |
          for dir in db db_extra db_custom dbs_min dbs_special peid_rules yara_rules; do
            mkdir -p "crates/die-gui/$dir"
            if [ -d "upstream/Detect-It-Easy/$dir" ]; then
              cp -r "upstream/Detect-It-Easy/$dir/"* "crates/die-gui/$dir/" 2>/dev/null || true
            fi
          done

      - name: Install Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.88.0 clippy

      - name: Verify MSRV declaration
        shell: bash
        run: |
          set -euo pipefail
          # The workspace rust-version must declare MSRV 1.88 per ADR 0011.
          grep -E '^rust-version = "1\.88"' Cargo.toml

      - name: cargo +1.88.0 build
        shell: bash
        run: |
          # die-gui (Tauri) deps (wasmtime 43, yara-x 1.19) require rustc 1.91+.
          # MSRV 1.88 applies to core crates only.
          cargo +1.88.0 build --workspace --exclude die-gui --all-targets --locked

      - name: cargo +1.88.0 test
        shell: bash
        run: |
          cargo +1.88.0 test --workspace --exclude die-gui --all-targets --locked

      - name: cargo +1.88.0 clippy
        shell: bash
        run: |
          cargo +1.88.0 clippy --workspace --exclude die-gui --all-targets --all-features --locked -- -D warnings -A clippy::uninlined_format_args

  # FFI smoke test: build the C ABI and run the C smoke test on each
  # platform. Verifies cross-platform static/dynamic linking and the
  # complete scan lifecycle from C.
  ffi-smoke:
    name: FFI smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build die-ffi (release)
        shell: bash
        run: cargo build -p die-ffi --release --locked

      - name: Build C smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -I include tests/c/smoke.c \
            -L target/release -ldie_ffi \
            -o target/smoke -lpthread -ldl -lm

      - name: Build C smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /I include tests/c/smoke.c /Fe:target\smoke.exe /link /NODEFAULTLIB:MSVCRT target\release\die_ffi.dll.lib

      - name: Run C smoke test
        shell: bash
        run: |
          if [ ! -d upstream/Detect-It-Easy/db ]; then
            echo "SKIP: upstream database not found"
            exit 0
          fi
          export DIE_DB_PATH="$PWD/upstream/Detect-It-Easy/db"
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$PWD/target/release:$PATH"
            target/smoke.exe
          else
            export LD_LIBRARY_PATH="$PWD/target/release:$LD_LIBRARY_PATH"
            target/smoke
          fi

  # Python binding smoke test: verify the ctypes binding loads and scans.
  python-binding:
    name: Python binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build die-ffi (release cdylib)
        shell: bash
        run: cargo build -p die-ffi --release --locked

      - name: Run Python tests
        shell: bash
        run: |
          if [ ! -d upstream/Detect-It-Easy/db ]; then
            echo "SKIP: upstream database not found"
            exit 0
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            export DIE_LIB_PATH="$PWD/target/release/die_ffi.dll"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            export DIE_LIB_PATH="$PWD/target/release/libdie_ffi.dylib"
          else
            export DIE_LIB_PATH="$PWD/target/release/libdie_ffi.so"
          fi
          python3 bindings/python/test_die.py
