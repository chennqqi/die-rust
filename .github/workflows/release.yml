name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Build CLI binary and FFI libraries for each platform.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: diec-linux-x86_64
            archive_ext: tar.gz
            cross_compile: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: diec-windows-x86_64
            archive_ext: zip
            cross_compile: false
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: diec-macos-arm64
            archive_ext: tar.gz
            cross_compile: false
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: diec-macos-x86_64
            archive_ext: tar.gz
            cross_compile: true

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          rustup component add clippy

      - name: Build CLI and FFI (release)
        shell: bash
        run: |
          # Exclude die-gui (Tauri) — built separately in build-gui job.
          # Requires GTK system libs on Linux which are installed there.
          cargo build --workspace --exclude die-gui --release --locked --target ${{ matrix.target }}

      - name: Run tests (native target only)
        if: matrix.cross_compile == false
        shell: bash
        run: |
          cargo test --workspace --exclude die-gui --all-features --locked --target ${{ matrix.target }}

      - name: Prepare release artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"
          staging="diec-${version}-${{ matrix.artifact_name }}"
          mkdir -p "$staging/base/db"
          mkdir -p "$staging/base/db_extra"
          mkdir -p "$staging/base/db_custom"
          mkdir -p "$staging/lib"
          mkdir -p "$staging/include"
          mkdir -p "$staging/bindings/python"
          mkdir -p "$staging/bindings/go/diec"

          # CLI binary lives in base/, matching upstream portable tree.
          cp "target/${{ matrix.target }}/release/diec" "$staging/base/"

          # died (die daemon) scan service binary.
          cp "target/${{ matrix.target }}/release/died" "$staging/base/" 2>/dev/null || true

          # Full three-tier rule database.
          if [ -d "upstream/Detect-It-Easy/db" ]; then
            cp -r "upstream/Detect-It-Easy/db/." "$staging/base/db/"
          fi
          if [ -d "upstream/Detect-It-Easy/db_extra" ]; then
            cp -r "upstream/Detect-It-Easy/db_extra/." "$staging/base/db_extra/"
          fi
          if [ -d "upstream/Detect-It-Easy/db_custom" ]; then
            cp -r "upstream/Detect-It-Easy/db_custom/." "$staging/base/db_custom/"
          fi

          # FFI libraries and header.
          cp "target/${{ matrix.target }}/release/libdiec_ffi.a" "$staging/lib/" 2>/dev/null || true
          cp "target/${{ matrix.target }}/release/libdiec_ffi.so" "$staging/lib/" 2>/dev/null || true
          cp "target/${{ matrix.target }}/release/libdiec_ffi.dylib" "$staging/lib/" 2>/dev/null || true
          cp "include/diec.h" "$staging/include/"

          # Language bindings.
          cp "bindings/python/diec.py" "$staging/bindings/python/"
          cp "bindings/go/diec/diec.go" "$staging/bindings/go/diec/"
          cp "bindings/go/go.mod" "$staging/bindings/go/"

          # Documentation and attribution.
          cp "README.md" "$staging/"
          cp "LICENSE" "$staging/"
          cp "NOTICES.md" "$staging/"

          # Top-level launcher, matching upstream portable launchers.
          printf '%s\n' '#!/bin/sh' 'CWD=$(dirname "$0")' 'exec "$CWD/base/diec" "$@"' > "$staging/diec"
          chmod +x "$staging/diec"

          # Create archive.
          tar czf "${staging}.tar.gz" "$staging"
          echo "ARTIFACT=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Prepare release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}"
          $staging = "diec-$version-${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path "$staging/base/db" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/base/db_extra" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/base/db_custom" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/bindings/python" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/bindings/go/diec" | Out-Null

          # CLI binary lives in base/, matching upstream portable tree.
          Copy-Item "target/${{ matrix.target }}/release/diec.exe" "$staging/base/"

          # died (die daemon) scan service binary.
          Copy-Item "target/${{ matrix.target }}/release/died.exe" "$staging/base/" -ErrorAction SilentlyContinue

          # Full three-tier rule database.
          if (Test-Path "upstream/Detect-It-Easy/db") {
            Copy-Item "upstream/Detect-It-Easy/db/*" "$staging/base/db/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "upstream/Detect-It-Easy/db_extra") {
            Copy-Item "upstream/Detect-It-Easy/db_extra/*" "$staging/base/db_extra/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "upstream/Detect-It-Easy/db_custom") {
            Copy-Item "upstream/Detect-It-Easy/db_custom/*" "$staging/base/db_custom/" -Recurse -Force -ErrorAction SilentlyContinue
          }

          # FFI libraries and header.
          Copy-Item "target/${{ matrix.target }}/release/diec_ffi.lib" "$staging/lib/" -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/diec_ffi.dll" "$staging/lib/" -ErrorAction SilentlyContinue
          Copy-Item "include/diec.h" "$staging/include/"

          # Language bindings.
          Copy-Item "bindings/python/diec.py" "$staging/bindings/python/"
          Copy-Item "bindings/go/diec/diec.go" "$staging/bindings/go/diec/"
          Copy-Item "bindings/go/go.mod" "$staging/bindings/go/"

          # Documentation and attribution.
          Copy-Item "README.md" "$staging/"
          Copy-Item "LICENSE" "$staging/"
          Copy-Item "NOTICES.md" "$staging/"

          # Top-level launcher, matching upstream portable launchers.
          Set-Content -Path "$staging/diec.cmd" -Value "@echo off`n`"%~dp0base\diec.exe`" %*" -Encoding ascii

          # Create archive
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"
          "ARTIFACT=$staging.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30

  # Build die-gui (Tauri v2) desktop application.
  # Produces both installer packages (MSI/NSIS/DEB/RPM/DMG) and portable
  # archives (zip/tar.gz) for each platform.
  build-gui:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            portable_name: die-gui-windows-x86_64-portable
            installer_name: die-gui-windows-x86_64-installers
          - os: ubuntu-24.04
            portable_name: die-gui-linux-x86_64-portable
            installer_name: die-gui-linux-x86_64-installers
          - os: macos-14
            portable_name: die-gui-macos-arm64-portable
            installer_name: die-gui-macos-arm64-installers

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            pkg-config \
            patchelf

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup component add clippy
          if [ "${{ runner.os }}" = "Windows" ]; then
            rustup target add x86_64-pc-windows-msvc
          elif [ "${{ runner.os }}" = "Linux" ]; then
            rustup target add x86_64-unknown-linux-gnu
          elif [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install frontend dependencies
        shell: bash
        working-directory: crates/die-gui/frontend
        run: npm install

      - name: Build frontend
        shell: bash
        working-directory: crates/die-gui/frontend
        run: npm run build

      # --- Copy all data directories for bundling into installers ---
      - name: Copy data directories for bundling
        shell: bash
        run: |
          for dir in db db_extra db_custom dbs_min dbs_special peid_rules yara_rules; do
            mkdir -p "crates/die-gui/$dir"
            if [ -d "upstream/Detect-It-Easy/$dir" ]; then
              cp -r "upstream/Detect-It-Easy/$dir/"* "crates/die-gui/$dir/" 2>/dev/null || true
            fi
          done

      # --- Build portable binary (no bundling) ---
      - name: Build portable binary (release)
        shell: bash
        run: cargo build -p die-gui --release --locked

      - name: Install tauri-cli
        shell: bash
        run: |
          cargo install tauri-cli --locked 2>&1 || echo "WARN: tauri-cli install failed"

      - name: Build GUI bundles (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: crates/die-gui
        run: |
          # Generate MSI + NSIS installers.
          # tauri bundler requires the frontend dist to already exist.
          cargo tauri build --bundles msi,nsis 2>&1 || echo "WARN: bundle build may need WiX"

      - name: Build GUI bundles (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: crates/die-gui
        run: |
          # Generate DEB + RPM + AppImage.
          cargo tauri build --bundles deb,rpm,appimage 2>&1 || echo "WARN: some bundles may fail"

      - name: Build GUI bundles (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: crates/die-gui
        run: |
          # Generate DMG + app bundle.
          cargo tauri build --bundles dmg,app 2>&1 || echo "WARN: bundle build may fail"

      # --- Prepare portable archive ---
      - name: Prepare portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "${{ matrix.portable_name }}"
          New-Item -ItemType Directory -Force -Path "$staging" | Out-Null
          Copy-Item "target/release/die.exe" "$staging/"
          # Copy all data directories.
          foreach ($dir in @("db","db_extra","db_custom","dbs_min","dbs_special","peid_rules","yara_rules")) {
            if (Test-Path "upstream/Detect-It-Easy/$dir") {
              New-Item -ItemType Directory -Force -Path "$staging/$dir" | Out-Null
              Copy-Item "upstream/Detect-It-Easy/$dir/*" "$staging/$dir/" -Recurse -Force
            }
          }
          Copy-Item "README.md" "$staging/"
          Copy-Item "LICENSE" "$staging/"
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"
          "PORTABLE_ARTIFACT=$staging.zip" >> $env:GITHUB_ENV

      - name: Prepare portable archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="${{ matrix.portable_name }}"
          mkdir -p "$staging"
          cp "target/release/die" "$staging/"
          # Copy all data directories.
          for dir in db db_extra db_custom dbs_min dbs_special peid_rules yara_rules; do
            if [ -d "upstream/Detect-It-Easy/$dir" ]; then
              mkdir -p "$staging/$dir"
              cp -r "upstream/Detect-It-Easy/$dir/." "$staging/$dir/" 2>/dev/null || true
            fi
          done
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "PORTABLE_ARTIFACT=$staging.tar.gz" >> $GITHUB_ENV

      # --- Collect installer artifacts ---
      - name: Collect installer artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "${{ matrix.installer_name }}"
          New-Item -ItemType Directory -Force -Path "$staging" | Out-Null
          # MSI installers.
          Get-ChildItem "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$staging/"
          }
          # NSIS installers.
          Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$staging/"
          }
          if ((Get-ChildItem "$staging" -File | Measure-Object).Count -gt 0) {
            Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"
            "INSTALLER_ARTIFACT=$staging.zip" >> $env:GITHUB_ENV
          } else {
            echo "No installer artifacts found"
          }

      - name: Collect installer artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          staging="${{ matrix.installer_name }}"
          mkdir -p "$staging"
          found=false
          # DEB packages.
          for f in target/release/bundle/deb/*.deb; do
            [ -f "$f" ] && cp "$f" "$staging/" && found=true
          done
          # RPM packages.
          for f in target/release/bundle/rpm/*.rpm; do
            [ -f "$f" ] && cp "$f" "$staging/" && found=true
          done
          # AppImage.
          for f in target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] && cp "$f" "$staging/" && found=true
          done
          if [ "$found" = "true" ]; then
            tar czf "$staging.tar.gz" "$staging"
            echo "INSTALLER_ARTIFACT=$staging.tar.gz" >> $GITHUB_ENV
          else
            echo "No installer artifacts found"
          fi

      - name: Collect installer artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          staging="${{ matrix.installer_name }}"
          mkdir -p "$staging"
          found=false
          # DMG.
          for f in target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "$staging/" && found=true
          done
          # App bundle.
          for f in target/release/bundle/macos/*.app; do
            [ -d "$f" ] && cp -r "$f" "$staging/" && found=true
          done
          if [ "$found" = "true" ]; then
            tar czf "$staging.tar.gz" "$staging"
            echo "INSTALLER_ARTIFACT=$staging.tar.gz" >> $GITHUB_ENV
          else
            echo "No installer artifacts found"
          fi

      # --- Upload artifacts ---
      - name: Upload portable artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.portable_name }}
          path: ${{ env.PORTABLE_ARTIFACT }}
          retention-days: 30

      - name: Upload installer artifacts
        if: env.INSTALLER_ARTIFACT != ''
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.installer_name }}
          path: ${{ env.INSTALLER_ARTIFACT }}
          retention-days: 30

  # Create GitHub release with all artifacts.
  release:
    name: Create release
    needs: [build, build-gui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          find artifacts -type f
          ls -la artifacts/*/ || true

      - name: Extract changelog for this version
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ inputs.version || github.ref_name }}"
          # Extract only the current version's changelog section from
          # RELEASE_NOTES.md (from "## diec-rust <version>" to the next
          # "## diec-rust" heading or EOF).
          # This keeps GitHub release pages concise — each release shows
          # only its own changes, not the full history.
          awk -v ver="$version" '
            BEGIN { found=0 }
            /^## diec-rust / {
              if (found) exit 0      # reached next version section, stop
              if (index($0, ver)) { found=1; print; next }
            }
            { if (found) print }
          ' RELEASE_NOTES.md > release_notes_current.md

          # Fallback: if extraction produced empty output (e.g. version
          # mismatch), use the full file to avoid a blank release page.
          if [ ! -s release_notes_current.md ]; then
            echo "WARNING: could not extract changelog for $version, using full RELEASE_NOTES.md"
            cp RELEASE_NOTES.md release_notes_current.md
          fi

          echo "--- Extracted release notes (first 5 lines) ---"
          head -5 release_notes_current.md
          echo "---"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ inputs.version || github.ref_name }}"

          # Check if release already exists
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, uploading artifacts"
            gh release upload "$tag" artifacts/*/* --clobber
          else
            echo "Creating release $tag"
            gh release create "$tag" \
              --title "diec-rust $version" \
              --notes-file release_notes_current.md \
              artifacts/*/*
          fi
