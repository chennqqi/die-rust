[package]
name = "die-rquickjs-static-link-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
rquickjs = { version = "=0.12.1", default-features = false, features = ["std"] }

[profile.release]
panic = "unwind"
